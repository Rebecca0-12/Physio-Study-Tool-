<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensory & Motor Physiology — Study Tool</title>
<style>
  :root{
    --bg:#f3f7fa;
    --panel:#ffffff;
    --ink:#1c2b36;
    --ink-soft:#4b6472;
    --line:#dbe6ec;
    --blue:#2e6a86;
    --blue-deep:#1f4e63;
    --blue-pale:#e8f1f6;
    --green:#2f8f5b;
    --green-pale:#e7f6ee;
    --red:#c94a3f;
    --red-pale:#fbeae8;
    --amber:#c98a2c;
    --radius:14px;
    --shadow:0 1px 2px rgba(28,43,54,.06), 0 6px 20px rgba(28,43,54,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Georgia","Iowan Old Style",serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:860px;margin:0 auto;padding:24px 20px 80px;}

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:20px; flex-wrap:wrap; gap:8px;
  }
  header.top h1{
    font-size:1.5rem; margin:0; font-weight:700; color:var(--blue-deep);
    letter-spacing:-.01em;
  }
  header.top .sub{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.8rem; color:var(--ink-soft);
  }

  nav.tabs{
    display:flex; gap:8px; margin-bottom:24px;
    background:var(--panel); padding:6px; border-radius:12px;
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; padding:10px 8px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.85rem; font-weight:600; color:var(--ink-soft);
    border-radius:8px; cursor:pointer; transition:.15s;
  }
  nav.tabs button.active{background:var(--blue); color:#fff;}
  nav.tabs button:hover:not(.active){background:var(--blue-pale); color:var(--blue-deep);}

  .panel{
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--line); padding:28px 30px;
  }

  /* ---- Summary ---- */
  #view-summary h2.part{
    font-size:1.2rem; color:var(--blue-deep); margin:34px 0 6px;
    padding-bottom:8px; border-bottom:2px solid var(--blue);
  }
  #view-summary h2.part:first-child{margin-top:0;}
  #view-summary h3{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.78rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--blue); margin:22px 0 8px; font-weight:700;
  }
  #view-summary p{line-height:1.65; margin:0 0 14px; font-size:.98rem; color:var(--ink);}
  #view-summary table{width:100%; border-collapse:collapse; margin:6px 0 20px; font-size:.88rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  #view-summary table caption{text-align:left; font-weight:700; color:var(--blue-deep); margin-bottom:6px; font-size:.85rem;}
  #view-summary th{background:var(--blue); color:#fff; text-align:left; padding:8px 10px; font-weight:600;}
  #view-summary td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  #view-summary tr:nth-child(even) td{background:var(--blue-pale);}

  /* ---- Flashcards ---- */
  #view-flash{text-align:center;}
  .fc-progress{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.8rem; color:var(--ink-soft); margin-bottom:14px;
  }
  .fc-stage{perspective:1600px; height:280px; margin-bottom:20px; cursor:pointer;}
  .fc-card{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .fc-card.flipped{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    padding:32px; font-size:1.15rem; line-height:1.5; box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .fc-face.front{background:linear-gradient(155deg,#ffffff,var(--blue-pale)); color:var(--ink);}
  .fc-face.back{
    background:linear-gradient(155deg,var(--blue),var(--blue-deep)); color:#fff;
    transform:rotateY(180deg); font-weight:600;
  }
  .fc-label{
    position:absolute; top:14px; left:18px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; opacity:.6;
  }
  .fc-hint{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.75rem; color:var(--ink-soft); margin-bottom:18px;
  }
  .fc-controls{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  /* ---- Buttons ---- */
  button.btn{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:600; font-size:.88rem; padding:11px 20px; border-radius:10px;
    border:1px solid var(--line); background:#fff; color:var(--blue-deep);
    cursor:pointer; transition:.15s;
  }
  button.btn:hover{background:var(--blue-pale); border-color:var(--blue);}
  button.btn.primary{background:var(--blue); color:#fff; border-color:var(--blue);}
  button.btn.primary:hover{background:var(--blue-deep);}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}
  button.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
  button.btn.ghost:hover{color:var(--red); background:var(--red-pale);}

  /* ---- MCQ ---- */
  #view-quiz .quiz-top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .quiz-progress-bar{
    height:6px; background:var(--blue-pale); border-radius:4px; overflow:hidden; margin-bottom:20px;
  }
  .quiz-progress-fill{height:100%; background:var(--blue); transition:width .3s;}
  .quiz-score{font-size:.82rem; color:var(--ink-soft); font-weight:600;}
  .q-text{font-size:1.12rem; line-height:1.5; margin-bottom:20px; font-weight:600; color:var(--ink);}
  .q-options{display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
  .q-option{
    text-align:left; padding:13px 16px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.92rem; color:var(--ink); cursor:pointer; transition:.12s;
    display:flex; gap:10px; align-items:center;
  }
  .q-option:hover:not(.locked){border-color:var(--blue); background:var(--blue-pale);}
  .q-option .letter{
    width:22px; height:22px; border-radius:50%; background:var(--blue-pale); color:var(--blue-deep);
    display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; flex-shrink:0;
  }
  .q-option.correct{background:var(--green-pale); border-color:var(--green); color:#155c37;}
  .q-option.correct .letter{background:var(--green); color:#fff;}
  .q-option.wrong{background:var(--red-pale); border-color:var(--red); color:#8a2f26;}
  .q-option.wrong .letter{background:var(--red); color:#fff;}
  .q-option.locked{cursor:default;}
  .q-feedback{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.85rem; font-weight:700; margin-bottom:16px; padding:10px 14px; border-radius:10px;
  }
  .q-feedback.correct{background:var(--green-pale); color:#155c37;}
  .q-feedback.wrong{background:var(--red-pale); color:#8a2f26;}
  .quiz-controls{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}

  .quiz-end{text-align:center; padding:20px 0;}
  .quiz-end .big{font-size:2.4rem; font-weight:800; color:var(--blue-deep); margin-bottom:4px;}
  .quiz-end .msg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink-soft); margin-bottom:22px;}

  .hidden{display:none !important;}

  @media (max-width:600px){
    .panel{padding:20px 18px;}
    .fc-stage{height:230px;}
    .fc-face{font-size:1rem; padding:22px;}
  }
</style>
</head>

<div class="app">
  <header class="top">
    <h1>Sensory &amp; Motor Physiology</h1>
    <div class="sub">Summary · 100 Flashcards · 100 Practice Questions</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="summary">Summary</button>
    <button class="tab-btn" data-view="flash">Flashcards</button>
    <button class="tab-btn" data-view="quiz">Practice Quiz</button>
  </nav>

  <div class="panel">
    <div id="view-summary"></div>

    <div id="view-flash" class="hidden">
      <div class="fc-progress" id="fc-progress">Card 1 of 100</div>
      <div class="fc-stage" id="fc-stage">
        <div class="fc-card" id="fc-card">
          <div class="fc-face front"><span class="fc-label">Question</span><div id="fc-front-text"></div></div>
          <div class="fc-face back"><span class="fc-label" style="color:#fff;opacity:.7">Answer</span><div id="fc-back-text"></div></div>
        </div>
      </div>
      <div class="fc-hint">Tap the card to flip it</div>
      <div class="fc-controls">
        <button class="btn" id="fc-prev">← Previous</button>
        <button class="btn" id="fc-shuffle">Shuffle</button>
        <button class="btn primary" id="fc-next">Next →</button>
      </div>
    </div>

    <div id="view-quiz" class="hidden">
      <div id="quiz-active">
        <div class="quiz-top">
          <span id="quiz-count">Question 1 of 100</span>
          <span class="quiz-score" id="quiz-score">Score: 0 / 0</span>
        </div>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress-fill" style="width:1%"></div></div>
        <div class="q-text" id="q-text"></div>
        <div class="q-options" id="q-options"></div>
        <div class="q-feedback hidden" id="q-feedback"></div>
        <div class="quiz-controls">
          <button class="btn ghost" id="quiz-exit">Stop &amp; exit</button>
          <button class="btn primary hidden" id="quiz-next">Next question →</button>
        </div>
      </div>
      <div id="quiz-end" class="quiz-end hidden">
        <div class="big" id="quiz-final-score"></div>
        <div class="msg" id="quiz-final-msg"></div>
        <button class="btn primary" id="quiz-restart">Start over</button>
        <button class="btn" id="quiz-review-missed">Review missed only</button>
      </div>
    </div>
  </div>
</div>

{"h":"1A. The Eye"},

let fcOrder = FLASHCARDS.map((_,i)=>i);
let fcIndex = 0;
let fcFlipped = false;
const fcCard = document.getElementById('fc-card');
const fcFront = document.getElementById('fc-front-text');
const fcBack = document.getElementById('fc-back-text');
const fcProgress = document.getElementById('fc-progress');

function renderFlashcard(){
  const realIdx = fcOrder[fcIndex];
  fcFront.textContent = FLASHCARDS[realIdx][0];
  fcBack.textContent = FLASHCARDS[realIdx][1];
  fcFlipped = false;
  fcCard.classList.remove('flipped');
  fcProgress.textContent = `Card ${fcIndex+1} of ${FLASHCARDS.length}`;
}
document.getElementById('fc-stage').addEventListener('click', ()=>{
  fcFlipped = !fcFlipped;
  fcCard.classList.toggle('flipped', fcFlipped);
});
document.getElementById('fc-next').addEventListener('click', ()=>{
  fcIndex = (fcIndex+1) % fcOrder.length;
  renderFlashcard();
});
document.getElementById('fc-prev').addEventListener('click', ()=>{
  fcIndex = (fcIndex-1+fcOrder.length) % fcOrder.length;
  renderFlashcard();
});
document.getElementById('fc-shuffle').addEventListener('click', ()=>{
  for(let i=fcOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [fcOrder[i],fcOrder[j]] = [fcOrder[j],fcOrder[i]];
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

// ---------- Quiz ----------
let quizOrder = MCQS.map((_,i)=>i);
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = 0;
let missed = [];
let locked = false;
let currentPool = MCQS;
let currentOrder = quizOrder;

const qText = document.getElementById('q-text');
const qOptions = document.getElementById('q-options');
const qFeedback = document.getElementById('q-feedback');
const quizCount = document.getElementById('quiz-count');
const quizScoreEl = document.getElementById('quiz-score');
const quizProgressFill = document.getElementById('quiz-progress-fill');
const quizNextBtn = document.getElementById('quiz-next');
const quizActive = document.getElementById('quiz-active');
const quizEnd = document.getElementById('quiz-end');

function startQuiz(pool){
  currentPool = pool;
  currentOrder = pool.map((_,i)=>i);
  quizIndex = 0; quizScore = 0; quizAnswered = 0; missed = [];
  quizActive.classList.remove('hidden');
  quizEnd.classList.add('hidden');
  renderQuestion();
}

function renderQuestion(){
  locked = false;
  const idx = currentOrder[quizIndex];
  const [q, opts, correct] = currentPool[idx];
  qText.textContent = q;
  qOptions.innerHTML = '';
  const letters = ['A','B','C','D'];
  opts.forEach((opt,i)=>{
    const div = document.createElement('div');
    div.className = 'q-option';
    div.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    div.addEventListener('click', ()=> selectAnswer(i, correct, div));
    qOptions.appendChild(div);
  });
  qFeedback.classList.add('hidden');
  quizNextBtn.classList.add('hidden');
  quizCount.textContent = `Question ${quizIndex+1} of ${currentPool.length}`;
  quizScoreEl.textContent = `Score: ${quizScore} / ${quizAnswered}`;
  quizProgressFill.style.width = `${((quizIndex)/currentPool.length)*100}%`;
}

function selectAnswer(chosenIdx, correctIdx, el){
  if(locked) return;
  locked = true;
  quizAnswered++;
  const allOptions = qOptions.querySelectorAll('.q-option');
  allOptions.forEach(o=>o.classList.add('locked'));
  if(chosenIdx === correctIdx){
    quizScore++;
    el.classList.add('correct');
    qFeedback.textContent = 'Correct!';
    qFeedback.className = 'q-feedback correct';
  } else {
    el.classList.add('wrong');
    allOptions[correctIdx].classList.add('correct');
    qFeedback.textContent = 'Not quite — correct answer highlighted above.';
    qFeedback.className = 'q-feedback wrong';
    const idx = currentOrder[quizIndex];
    missed.push(currentPool[idx]);
  }
  qFeedback.classList.remove('hidden');
  quizNextBtn.classList.remove('hidden');
  quizScoreEl.textContent = `Score: ${quizScore} / ${quizAnswered}`;
  quizProgressFill.style.width = `${((quizIndex+1)/currentPool.length)*100}%`;
}

quizNextBtn.addEventListener('click', ()=>{
  if(quizIndex < currentPool.length - 1){
    quizIndex++;
    renderQuestion();
  } else {
    endQuiz();
  }
});

document.getElementById('quiz-exit').addEventListener('click', ()=>{
  endQuiz();
});

function endQuiz(){
  quizActive.classList.add('hidden');
  quizEnd.classList.remove('hidden');
  const pct = quizAnswered ? Math.round((quizScore/quizAnswered)*100) : 0;
  document.getElementById('quiz-final-score').textContent = `${quizScore} / ${quizAnswered}`;
  let msg = `${pct}% correct on the questions you answered.`;
  if(missed.length) msg += ` ${missed.length} to review.`;
  document.getElementById('quiz-final-msg').textContent = msg;
  document.getElementById('quiz-review-missed').classList.toggle('hidden', missed.length===0);
}

document.getElementById('quiz-restart').addEventListener('click', ()=> startQuiz(MCQS));
document.getElementById('quiz-review-missed').addEventListener('click', ()=>{
  if(missed.length) startQuiz(missed.slice());
});

startQuiz(MCQS);
</script>
